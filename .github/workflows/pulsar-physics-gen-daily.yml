name: Pulsar Physics-Gen Daily

# Runs every weekday 00:40 UTC (≈ 08:40 CN time, after arxiv RSS refresh; offset 10min
# after the sister Spatial pipeline's 00:30 to stagger DashScope load).
# Generates reports/physics-gen-daily/YYYY-MM-DD.md from arxiv
# cs.CV / cs.LG / cs.GR / cs.RO / cs.AI / physics.flu-dyn / cond-mat.soft.
#
# Required GitHub Secret (Settings → Secrets → Actions):
#   DASHSCOPE_API_KEY — Aliyun qwen3.5-plus API key
#
# Manual trigger: Actions tab → Pulsar Physics-Gen Daily → Run workflow.

on:
  schedule:
    # Mon-Fri only (arxiv 沒週末發新)
    - cron: '40 0 * * 1-5'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write  # need to push back to main

concurrency:
  group: pulsar-physics-gen-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to pull/rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Pulsar pipeline
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          python3 scripts/pulsar/run_daily.py

      # Commit the dated archive FIRST, before any audit. The daily report is
      # append-only archive content (reports/physics-gen-daily/) and must never be
      # silently discarded because of unrelated handbook drift elsewhere. The
      # full-handbook audit runs afterwards as an informational signal only; the
      # separate audit.yml workflow remains the real gate for content PRs/pushes.
      - name: Commit + push (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Pulsar Bot"
          git config user.email "noreply@anthropic.com"

          # Add scoped changes only (don't accidentally commit anything else)
          git add reports/physics-gen-daily/

          # Exit cleanly if nothing changed (e.g. weekend or zero qualifying papers)
          if git diff --staged --quiet; then
            echo "No new physics-gen-daily report — skipping commit."
            exit 0
          fi

          # Pull latest before commit to minimize push conflicts
          git pull --rebase origin main || {
            echo "Rebase failed — manual intervention needed."
            exit 1
          }

          DATE=$(date +%F)
          MSG=$(cat <<EOF
          auto(pulsar): physics-gen daily ${DATE}

          Generated by GitHub Actions workflow .github/workflows/pulsar-physics-gen-daily.yml
          Pipeline: collect.py → rate.py (qwen3.5-plus) → post.py
          EOF
          )
          git commit -m "$MSG"

          # Push (retry once on conflict)
          git push origin main || {
            echo "Push conflict, retrying after rebase..."
            git pull --rebase origin main
            git push origin main
          }

      # Informational only — never blocks (or reverts) the archive commit above.
      - name: Handbook audit (informational)
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/sync_readme_from_overview.py || true
          python3 scripts/handbook_audit.py
